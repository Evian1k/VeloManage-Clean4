apiVersion: v1
kind: ConfigMap
metadata:
  name: velomanage-config
  namespace: velomanage
  labels:
    app.kubernetes.io/name: velomanage
    app.kubernetes.io/part-of: velomanage
data:
  NODE_ENV: "production"
  API_VERSION: "v1"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  # Comma-separated list of additional CORS origins (front-end domain etc.)
  ADDITIONAL_CORS_ORIGINS: "https://velomanage.example.com"
  # Mongo is reached via an internal service or Atlas; see secret.yaml.example
  # for the connection string itself.
  MONGO_DB_NAME: "velomanage"
