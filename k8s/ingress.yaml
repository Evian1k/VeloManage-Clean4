apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velomanage-ingress
  namespace: velomanage
  labels:
    app.kubernetes.io/name: velomanage
    app.kubernetes.io/part-of: velomanage
  annotations:
    # nginx ingress controller
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # WebSocket support for socket.io
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # cert-manager (uncomment if installed)
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - velomanage.example.com
      secretName: velomanage-tls
  rules:
    - host: velomanage.example.com
      http:
        paths:
          # API requests -> backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: velomanage-backend
                port:
                  number: 10000
          # Socket.io -> backend
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: velomanage-backend
                port:
                  number: 10000
          # Everything else -> frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: velomanage-frontend
                port:
                  number: 80
