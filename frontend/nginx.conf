# =============================================================================
# VeloManage Frontend — nginx config
# =============================================================================
# - Serves the Vite-built SPA from /usr/share/nginx/html
# - SPA fallback: unknown routes fall through to index.html (React Router)
# - Gzip enabled for text-like responses
# - Long-lived cache for hashed build assets; short cache for index.html
# - Proxies /api/* to the backend service (compose service name: `backend`)
# =============================================================================

# Connection & performance tuning
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Log format — combined plus request_time for slow-request debugging
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  server_tokens   off;

  # ---- Gzip ----
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

  # Upstream backend service (docker-compose service name `backend`)
  upstream backend_upstream {
    server backend:10000;
    keepalive 32;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Max upload size — match backend's express.json limit
    client_max_body_size 12m;

    # ---- API proxy ----
    # Forward all /api/* requests to the backend container.
    location /api/ {
      proxy_pass         http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # ---- WebSocket proxy (socket.io) ----
    location /socket.io/ {
      proxy_pass         http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    # ---- Static hashed assets: cache aggressively (1 year) ----
    # Vite emits files like /assets/index-a1b2c3d4.js — name has content hash,
    # so it's safe to cache forever.
    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
    }

    # ---- Other static file extensions (favicon, fonts, images) ----
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|otf|css|js|map)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    # ---- index.html: must NOT be cached so deploys are picked up immediately ----
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      expires 0;
    }

    # ---- SPA fallback: try the file, then a dir, then index.html ----
    location / {
      try_files $uri $uri/ /index.html;
    }

    # ---- Healthcheck endpoint (for Docker / k8s) ----
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
}
