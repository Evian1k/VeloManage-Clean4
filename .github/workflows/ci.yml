# =============================================================================
# VeloManage — CI pipeline
# =============================================================================
# Runs on every push to `main` and every PR targeting `main`.
#
# Jobs:
#   1. backend-test    — lint + syntax smoke test + Docker build
#   2. frontend-test   — install + production build
#   3. docker-build    — builds both images; pushes to GHCR only on `main`
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same PR/branch to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend: lint + syntax check + Docker build
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (skip if no script)
        continue-on-error: true
        run: |
          if npm run | grep -q " lint"; then
            npm run lint
          else
            echo "No 'lint' script found — skipping."
          fi

      - name: Smoke syntax check (server.js)
        run: node --check server.js

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: velomanage-backend:ci
          load: true

      - name: Verify image runs /health
        run: |
          set -euo pipefail
          docker run -d --name backend-ci -p 10000:10000 \
            -e PORT=10000 -e NODE_ENV=production velomanage-backend:ci
          sleep 3
          # /health returns 503 if Mongo not connected, but the endpoint itself
          # should respond (HTTP 200 or 503). Anything else = broken image.
          code=$(curl -s -o /tmp/health.out -w "%{http_code}" http://127.0.0.1:10000/health || true)
          echo "HTTP code: $code"
          cat /tmp/health.out || true
          if [ "$code" = "200" ] || [ "$code" = "503" ]; then
            echo "Backend image OK"
          else
            echo "Backend image FAILED — unexpected HTTP status $code"
            docker logs backend-ci || true
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 2. Frontend: install + production build
  # ---------------------------------------------------------------------------
  frontend-test:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (skip if no script)
        continue-on-error: true
        run: |
          if npm run | grep -q " lint"; then
            npm run lint
          else
            echo "No 'lint' script found — skipping."
          fi

      - name: Build
        run: npm run build

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Build & (on main) push Docker images to GHCR
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker — build & push
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image names
        id: img
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${{ env.REGISTRY }}/${REPO_LC}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ env.REGISTRY }}/${REPO_LC}-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) — backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.backend }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr

      - name: Extract metadata (tags, labels) — frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.frontend }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
